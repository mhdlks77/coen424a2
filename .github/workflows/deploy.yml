name: CI/CD Deployment

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API Gateway
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway ./api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway

      - name: Build User MS v1
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-ms-v1 ./user-ms-v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-ms-v1

      - name: Build User MS v2
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-ms-v2 ./user-ms-v2
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-ms-v2

      - name: Build Order MS
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-ms ./order-ms
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-ms


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: SSH into EC2 & Deploy
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/microservices-sync

            # stop old containers
            sudo docker compose down

            # pull updated images
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/user-ms-v1
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/user-ms-v2
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/order-ms

            # restart services
            sudo docker compose up -d
          EOF
